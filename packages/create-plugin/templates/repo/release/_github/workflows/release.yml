name: Release

# Publishes the signed plugin repository (RELEASING.md): each manifest version not yet in the index gets a
# `<id>-v<version>` release, and index.json on the `index` release is replaced. Releases never change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git; keep the token out of .git/config while dev dependencies run.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Download the published index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start a new index only when there really is none: on any other error (rate limit, network)
          # stop, rather than rebuild every released version.
          if out=$(gh release view index 2>&1); then
            gh release download index --pattern index.json --dir .repo-current
          elif grep -qi 'release not found' <<<"$out"; then
            echo "No index release yet: starting a new index."
          else
            echo "::error::Could not read the index release: $out"
            exit 1
          fi

      - name: Pack new plugin versions
        id: pack
        run: |
          pnpm exec synoikia-plugin repo pack
          echo "count=$(node -p "require('./.repo/releases.json').length")" >> "$GITHUB_OUTPUT"

      - name: Sign
        if: steps.pack.outputs.count != '0'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret is not set."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          for f in .repo/*.tgz; do
            minisign -S -s "$key" -m "$f" -t "$(basename "$f")"
            minisign -V -p minisign.pub -m "$f"
          done

      - name: Build the index
        if: steps.pack.outputs.count != '0'
        run: pnpm exec synoikia-plugin repo index

      # Synoikia's own repository service installs every new version with minisign.pub pinned, before
      # anything is uploaded.
      - name: Verify with Synoikia
        if: steps.pack.outputs.count != '0'
        run: pnpm exec synoikia-plugin repo verify

      - name: Publish
        if: steps.pack.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec synoikia-plugin repo publish
