name: Release draft

# Each merge to main updates the draft release. Publishing the draft runs release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release-draft

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/release/draft.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
