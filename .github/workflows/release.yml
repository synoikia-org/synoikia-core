name: Release

# Publishes the versions of a published GitHub release: the npm packages not on npm yet, and the image at the tag.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing, and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1
      - name: Write the release versions
        id: stamp
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: node scripts/release/stamp.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synoikia/plugin-sdk --filter @synoikia/core --filter @synoikia/create-plugin build
      - name: Publish new versions
        env:
          # No token: npm trusted publishing authenticates. Empty, not unset, so setup-node's .npmrc
          # placeholder can't stand in for one.
          NODE_AUTH_TOKEN: ''
          # npm only accepts provenance from public source repositories.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
          # A refused trusted publish only says ENEEDAUTH or E403; the reason is logged at verbose.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          # SDK first: core's published dependency on it must resolve, and create-plugin depends on both.
          for dir in packages/plugin-sdk packages/core packages/create-plugin; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            tag=latest
            if [[ "$version" == *-* ]]; then tag=next; fi
            # pnpm pack rewrites workspace: ranges to real versions.
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/pack" | tail -n 1)
            npm publish "$tarball" --access public --tag "$tag" --provenance="$PROVENANCE"
          done

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the release versions
        id: stamp
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: node scripts/release/stamp.mjs
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether to publish
        id: decide
        env:
          VERSION: ${{ steps.stamp.outputs.image }}
        run: |
          set -euo pipefail
          image=ghcr.io/synoikia-org/synoikia
          version="$VERSION"
          if docker manifest inspect "$image:$version" >/dev/null 2>&1; then
            echo "$image:$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # Stable versions also move the floating `latest` tag; prereleases only get their own tag.
            if [[ "$version" == *-* ]]; then
              echo "tags=ghcr.io/synoikia-org/synoikia:$version" >> "$GITHUB_OUTPUT"
            else
              echo "tags=ghcr.io/synoikia-org/synoikia:$version,ghcr.io/synoikia-org/synoikia:latest" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.decide.outputs.publish == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.decide.outputs.tags }}
