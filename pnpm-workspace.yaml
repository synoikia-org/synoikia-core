packages:
  - packages/*

onlyBuiltDependencies:
  - esbuild
  # node-gyp-build picks the shipped prebuild; it only compiles if none matches.
  - isolated-vm

# better-sqlite3 ships prebuilt N-API binaries for all supported platforms; skip its node-gyp fallback
# (which would need Python and a compiler in the image).
ignoredBuiltDependencies:
  - better-sqlite3
  # vue-demi's postinstall only switches Vue 2/3 builds; its default lib already targets Vue 3.
  - vue-demi

overrides:
  '@tanstack/match-sorter-utils': 9.1.2
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  express-rate-limit>ip-address: ^10.7.4
  likec4>vite: ^8.3.5
  source-map-js: ^1.2.2
  uuid: ^11.1.1
