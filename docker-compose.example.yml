# Example deployment. Publish 8080 through your reverse proxy as https://mcp.example.com; the admin
# portal runs on its own dedicated port, 8081 — see the README, Deployment.
services:
  synoikia:
    # `latest` tracks the newest stable release; pin an explicit version (e.g. `:0.2.0`) in production.
    image: ghcr.io/synoikia-org/synoikia:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:8080:8080' # MCP endpoints → reverse proxy
      - '192.168.1.10:8081:8081' # Admin portal → dedicated port (adjust the bind address to your host)
      # - '192.168.1.10:9464:9464' # Metrics for Prometheus, when METRICS_PORT=9464 is set
    volumes:
      - synoikia-data:/data

volumes:
  synoikia-data:
